<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1B4D3E" />
    <meta name="description" content="麻雀の牌姿と考え方を記録・検索・復習する個人学習帳" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="麻雀学習帳" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>麻雀学習帳</title>
    <script>
      // 本体の読み込み前に配色を決めて、起動時に別テーマの色が一瞬見えないようにする
      try {
        var t = localStorage.getItem('mahjong-study:theme');
        var colors = { normal: '#1B4D3E', cool: '#0B1118', cute: '#FBE3EE', dopa: '#090B18' };
        if (Object.prototype.hasOwnProperty.call(colors, t)) {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[t]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
