name: Session review UI checks
on:
  pull_request:
    paths:
      - 'src/features/test/**'
      - 'src/features/records/**'
      - 'src/domain/sessionRetest*'
      - 'src/domain/tagRecords*'
      - 'scripts/validate-session-review-ui.mjs'
      - '.github/workflows/session-review-ui.yml'
permissions:
  contents: read
jobs:
  session-review-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/domain/sessionRetest.test.ts src/domain/tagRecords.test.ts src/features/test/SessionRetest.test.tsx src/features/records/TagStudySummary.test.tsx --maxWorkers=1
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify session retries and actual tag rates across themes
        run: |
          npm run preview -- --host 127.0.0.1 --port 5182 --base /mj_study/ > /tmp/mahjong-review-preview.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:5182/mj_study/ > /dev/null && break; sleep 1; done
          node scripts/validate-session-review-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-review-screenshots
          path: evidence/session-review/
          retention-days: 7
