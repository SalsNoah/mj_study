name: Retired problem sharing UI checks
on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'src/features/share/**'
      - 'src/features/detail/**'
      - 'src/features/editor/**'
      - 'src/features/library/**'
      - 'src/features/records/**'
      - 'src/features/settings/**'
      - 'src/storage/**'
      - 'src/domain/**'
      - 'src/test/fixtures/legacy-problem-share.json'
      - 'scripts/validate-share-import-ui.mjs'
      - 'scripts/editor-ui-helpers.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/share-import-ui.yml'
permissions:
  contents: read
jobs:
  share-import-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify retired legacy URLs, preserved data, and remaining mobile tools
        run: |
          npm run preview -- --host 127.0.0.1 --port 5178 --base /mj_study/ > /tmp/mahjong-share-preview.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:5178/mj_study/ > /dev/null && break; sleep 1; done
          node scripts/validate-share-import-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retired-problem-sharing-screenshots
          path: evidence/share-import/
          retention-days: 7
