name: Legacy hand revision checks
on:
  pull_request:
    paths:
      - 'src/domain/validate*'
      - 'src/storage/repository*'
      - 'src/features/editor/**'
      - 'scripts/validate-legacy-hand-ui.mjs'
      - '.github/workflows/legacy-hand-ui.yml'
permissions:
  contents: read
jobs:
  legacy-hand-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/domain/validate.test.ts src/storage/repository.test.ts src/features/editor/EditorHeader.test.tsx src/domain/unifiedHandCompatibility.test.ts src/storage/sampleCatalogStorage.test.ts --maxWorkers=1
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Preserve legacy study state through the actual editor
        run: |
          npm run preview -- --host 127.0.0.1 --port 5183 > /tmp/mahjong-legacy-preview.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:5183/ > /dev/null && break; sleep 1; done
          node scripts/validate-legacy-hand-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-hand-screenshots
          path: evidence/legacy-hand/
          retention-days: 7
