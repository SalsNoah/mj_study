name: Sample bulk UI checks
on:
  pull_request:
    paths:
      - 'src/data/sampleCatalog.ts'
      - 'src/storage/**'
      - 'src/app/store.tsx'
      - 'src/components/ConfirmDialog.tsx'
      - 'src/features/settings/Sample*'
      - 'scripts/validate-sample-bulk-ui.mjs'
      - '.github/workflows/sample-bulk-ui.yml'
permissions:
  contents: read
jobs:
  sample-bulk-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise synthetic sample addition, safe removal and restoration
        run: |
          npm run dev -- --host 127.0.0.1 --port 5176 > /tmp/mahjong-sample-bulk.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:5176/ > /dev/null && break; sleep 1; done
          node scripts/validate-sample-bulk-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-bulk-screenshots
          path: evidence/sample-bulk/
          retention-days: 7
