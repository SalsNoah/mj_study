name: Record sharing UI checks
on:
  pull_request:
    paths:
      - 'src/features/records/**'
      - 'src/domain/recordShare*'
      - 'src/domain/recordSeries*'
      - 'scripts/validate-record-share-ui.mjs'
      - '.github/workflows/record-share-ui.yml'
permissions:
  contents: read
jobs:
  record-share-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Inspect synthetic record images and sharing controls
        run: |
          npm run dev -- --host 127.0.0.1 --port 5176 > /tmp/mahjong-share-vite.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:5176/ > /dev/null && break; sleep 1; done
          node scripts/validate-record-share-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-share-screenshots
          path: evidence/record-share-ui/
          retention-days: 7
