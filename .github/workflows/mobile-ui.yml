name: Responsive UI checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/validate-ukeire-ui.mjs'
      - 'scripts/editor-ui-helpers.mjs'
      - 'scripts/validate-desktop-ui.mjs'
      - 'scripts/validate-sample-ui.mjs'
      - 'scripts/validate-study-ui.mjs'
      - 'scripts/validate-problem-return-ui.mjs'
      - 'scripts/validate-problem-confirm-dock-ui.mjs'
      - 'scripts/check-record-cumulative.mjs'
      - 'scripts/validate-material-ui.mjs'
      - 'scripts/validate-theme-ui.mjs'
      - 'scripts/validate-theme-art-ui.mjs'
      - 'scripts/validate-dopa-neon-ui.mjs'
      - 'scripts/validate-dopa-button-ui.mjs'
      - 'scripts/validate-header-images-ui.mjs'
      - 'scripts/capture-dopa-preview.mjs'
      - 'scripts/validate-dora-ui.mjs'
      - 'scripts/validate-icon-ui.mjs'
      - 'index.html'
      - '.github/workflows/mobile-ui.yml'

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Render and test synthetic hands at mobile and desktop sizes
        run: |
          npm run dev -- --host 127.0.0.1 --port 5176 > /tmp/mahjong-vite.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:5176/ > /dev/null && break; sleep 1; done
          status=0
          node scripts/validate-ukeire-ui.mjs || status=1
          node scripts/validate-desktop-ui.mjs || status=1
          node scripts/validate-dora-ui.mjs || status=1
          node scripts/validate-icon-ui.mjs || status=1
          node scripts/validate-sample-ui.mjs || status=1
          MAHJONG_TEST_ORIGIN=http://127.0.0.1:5176 node scripts/validate-problem-return-ui.mjs || status=1
          MAHJONG_TEST_ORIGIN=http://127.0.0.1:5176 node scripts/validate-problem-confirm-dock-ui.mjs || status=1
          node scripts/validate-study-ui.mjs || status=1
          node scripts/validate-material-ui.mjs || status=1
          node scripts/validate-theme-ui.mjs || status=1
          node scripts/validate-theme-art-ui.mjs || status=1
          node scripts/validate-dopa-neon-ui.mjs || status=1
          node scripts/validate-header-images-ui.mjs || status=1
          node scripts/validate-dopa-button-ui.mjs || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-screenshots
          path: |
            evidence/ukeire/
            evidence/desktop/
            evidence/dora/
            evidence/icons/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-ui-screenshots
          path: |
            evidence/samples/
            evidence/study-ui/
            evidence/problem-return/
            evidence/problem-confirm-dock/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-ui-screenshots
          path: evidence/material-ui/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-ui-screenshots
          path: |
            evidence/theme-ui/
            !evidence/theme-ui/cool-*.png
            !evidence/theme-ui/cute-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cool-theme-screenshots
          path: evidence/theme-ui/cool-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cute-theme-screenshots
          path: evidence/theme-ui/cute-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-theme-screenshots
          path: evidence/theme-art/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dopa-neon-screenshots
          path: evidence/dopa-neon/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-images-screenshots
          path: evidence/header-images/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dopa-button-focus-screenshots
          path: |
            evidence/dopa-buttons/*focus*.png
            evidence/dopa-buttons/results.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dopa-button-state-screenshots
          path: |
            evidence/dopa-buttons/*-normal-*.png
            evidence/dopa-buttons/*-hover-*.png
            evidence/dopa-buttons/*-active-*.png
            evidence/dopa-buttons/results.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dopa-button-flow-screenshots
          path: |
            evidence/dopa-buttons/*.png
            evidence/dopa-buttons/results.json
            !evidence/dopa-buttons/*focus*.png
            !evidence/dopa-buttons/*-normal-*.png
            !evidence/dopa-buttons/*-hover-*.png
            !evidence/dopa-buttons/*-active-*.png
          retention-days: 7

  dopa-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture the actual DOPA editor
        run: |
          npm run dev -- --host 127.0.0.1 --port 5176 > /tmp/mahjong-preview-vite.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:5176/ > /dev/null && break; sleep 1; done
          node scripts/capture-dopa-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dopa-preview
          path: evidence/dopa-preview/
          retention-days: 7
