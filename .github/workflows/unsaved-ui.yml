name: Unsaved learning UI checks
on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/components/useUnsaved*'
      - 'src/components/ConfirmDialog.tsx'
      - 'src/features/editor/**'
      - 'src/features/materials/**'
      - 'scripts/validate-unsaved-ui.mjs'
      - '.github/workflows/unsaved-ui.yml'
permissions:
  contents: read
jobs:
  unsaved-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/features/unsavedChanges.test.tsx src/features/share/ShareImportFlow.test.tsx src/features/materials/MaterialsPage.test.tsx src/storage/repository.test.ts --maxWorkers=1
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify guarded navigation and accessible answer selection
        run: |
          npm run preview -- --host 127.0.0.1 --port 5180 --base /mj_study/ > /tmp/mahjong-unsaved-preview.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:5180/mj_study/ > /dev/null && break; sleep 1; done
          node scripts/validate-unsaved-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsaved-learning-screenshots
          path: evidence/unsaved-ui/
          retention-days: 7
