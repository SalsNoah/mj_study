name: Moe theme UI checks
on:
  pull_request:
    paths:
      - 'src/app/moe.css'
      - 'src/app/theme*'
      - 'src/features/settings/SettingsPage.tsx'
      - 'public/themes/moe/**'
      - 'scripts/validate-moe-theme-ui.mjs'
      - 'scripts/editor-ui-helpers.mjs'
      - 'docs/moe-art-sources.json'
      - '.github/workflows/moe-theme-ui.yml'
permissions:
  contents: read
jobs:
  moe-theme-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Inspect generated artwork, controls and reduced motion
        run: |
          npm run dev -- --host 127.0.0.1 --port 5176 > /tmp/mahjong-moe-vite.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:5176/ > /dev/null && break; sleep 1; done
          node scripts/validate-moe-theme-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-theme-screenshots
          path: evidence/moe-theme/
          retention-days: 7
